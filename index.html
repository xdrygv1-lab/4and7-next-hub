<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>4&7 NEXT 허브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 메뉴(6개) + 오른쪽 본문. 좁은 화면에서는 메뉴가 위로 접힘 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b2321; --sub:#5d6a66; --line:#dde2df;
  --accent:#1d5c55; --accent-ink:#ffffff; --tint:#e6efec; --warn:#a1560f; --bad:#a32d2d; --good:#2d6b3a;
  --f-body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--panel:#1a201e;--ink:#e3e9e6;--sub:#9aa8a3;--line:#2b3431;--accent:#6fb7aa;--accent-ink:#0f1513;--tint:#1f2b28;--warn:#e3a35f;--bad:#ef8a8a;--good:#7cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--panel:#1a201e;--ink:#e3e9e6;--sub:#9aa8a3;--line:#2b3431;--accent:#6fb7aa;--accent-ink:#0f1513;--tint:#1f2b28;--warn:#e3a35f;--bad:#ef8a8a;--good:#7cc58a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
a{color:var(--accent)}
[hidden]{display:none!important}
.shell{position:relative;display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.shell.collapsed{grid-template-columns:0 minmax(0,1fr)}
.shell.collapsed aside{visibility:hidden;padding-inline:0;border:0}
.toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:30;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:18px;line-height:1}
.shell:not(.collapsed) .toggle{left:226px}
.toggle:hover{background:var(--tint)}
@media(max-width:860px){.shell{grid-template-columns:1fr}.shell.collapsed{grid-template-columns:1fr}.shell:not(.collapsed) .toggle{left:auto;right:12px}.toggle{left:auto;right:12px}.shell.collapsed aside{display:none}}
@media (prefers-reduced-motion:reduce){.shell{transition:none}}
aside{border-right:1px solid var(--line);background:var(--panel);padding-block:20px;padding-inline:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;min-width:0;display:flex;flex-direction:column}
@media(max-width:860px){aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;padding-inline:8px}
.brand b{font-size:20px;letter-spacing:-.01em}.brand span{font-family:var(--f-mono);font-size:11px;color:var(--sub);letter-spacing:.08em}
.built{font-size:12px;color:var(--sub);margin-bottom:12px;padding-inline:8px}
nav{display:flex;flex-direction:column;gap:3px}
.navl{display:block;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.navl .nd{display:block;font-size:12px;font-weight:400;color:var(--sub);line-height:1.4;margin-top:1px}
.navl:hover{background:var(--tint)}.navl.on{background:var(--accent);color:var(--accent-ink)}.navl.on .nd{color:inherit;opacity:.8}
.navs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 12px;padding-left:8px;border-left:2px solid var(--line)}
.navs .navl{font-size:14px;font-weight:500;padding:6px 10px}
.navs .navl.on{background:var(--tint);color:var(--accent);font-weight:700}
.navfoot{margin-top:auto;padding:18px 8px 0;font-size:12.5px;color:var(--sub)}
.navfoot a{color:var(--sub);text-decoration:none}.navfoot a:hover,.navfoot a.on{color:var(--accent);text-decoration:underline}
@media(max-width:860px){.navl .nd{display:none}.navfoot{margin-top:10px}}
main{padding-block:28px 60px;padding-inline:clamp(16px,4vw,56px);min-width:0}
main.toolmode{padding:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-inline:60px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
@media(max-width:860px){.toolbar{padding-inline:16px 60px}}
.toolbar b{font-size:15px}
.toolpanel{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px}
.toolpanel .cbox{max-width:760px}
.frame{width:100%;height:calc(100vh - 54px);border:0;display:block;background:var(--bg)}
.beta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 18px;background:var(--panel)}
.beta b{color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;align-items:center}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.wrap{max-width:900px}
h1{font-size:28px;line-height:1.3;margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:20px;margin:30px 0 10px;text-wrap:balance}
h3{font-size:16px;margin:22px 0 8px}
.lede{color:var(--sub);margin:0 0 20px;max-width:62ch}
.small{font-size:13px;color:var(--sub)}
.crumb{font-size:13px;color:var(--sub);margin-bottom:8px}.crumb a{color:var(--sub)}
.notice{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:10px;padding:11px 14px;font-size:14px;margin:0 0 20px}
.notice b{color:var(--warn)}
/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 20px}
.cards.four{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:600px){.cards.four{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card .k{font-size:12px;font-weight:600;color:var(--accent)}
.card b{font-size:18px}.card span{font-size:14px;color:var(--sub)}
.card.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.card.main span,.card.main .k{color:inherit;opacity:.85}
.card .cnt{font-family:var(--f-mono);font-size:12px;color:var(--sub);margin-top:auto;padding-top:6px}
.card ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}.card li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{display:inline-block;font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tw{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px;background:var(--tint)}
code{font-family:var(--f-mono);font-size:13px;background:var(--tint);padding:1px 5px;border-radius:4px}
pre{background:var(--tint);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
pre code{background:none;padding:0}
blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--tint);border-radius:0 8px 8px 0}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);min-width:0}
a.row:hover{border-color:var(--accent)}
.row .t{min-width:0;overflow-wrap:anywhere}.row .d{font-family:var(--f-mono);font-size:12px;color:var(--sub);white-space:nowrap}
.steps{counter-reset:s;padding-left:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin:8px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;display:grid;place-items:center;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--sub);font-weight:500}
.pill.bad{color:var(--bad)}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 문서 읽기 */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3.5vw,40px);min-width:0;font-size:16px;line-height:1.75}
.doc>*:not(.tw):not(details){max-width:68ch}
.doc h1{font-size:25px;margin-bottom:14px}
.doc h2{font-size:19px;margin:2.2em 0 .7em;padding-top:1.1em;border-top:1px solid var(--line);position:relative}
.doc h2::before{content:"";position:absolute;top:-1px;left:0;width:36px;height:3px;background:var(--accent);border-radius:2px}
.doc h3{font-size:16.5px;margin:1.6em 0 .5em}
.doc ul,.doc ol{padding-left:1.3em}.doc li{margin:.3em 0}
.doc img{max-width:100%}
.doc blockquote.glance{border:0;border-radius:12px;background:var(--tint);padding:16px 18px;font-size:17px;line-height:1.7;margin:4px 0 20px}
.doc blockquote.glance p{margin:0}
.doc blockquote.say{position:relative;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);border-radius:4px 14px 14px 14px;padding:24px 14px 8px;margin:12px 0}
.doc blockquote.say::before{content:"말하기 예시";position:absolute;left:14px;top:5px;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.doc blockquote.say p{margin:.2em 0}
.doc tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tint) 55%,transparent)}
.doc .tw{border:1px solid var(--line);border-radius:10px}
.doc .tw table{font-size:14.5px;min-width:540px}.doc .tw th:first-child,.doc .tw td:first-child{padding-left:12px}
.doc .tw tr:last-child td{border-bottom:0}
.doc li.task{list-style:none;margin-left:-1.3em;display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.doc li.task input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:4px 0 0;border:2px solid var(--accent);border-radius:5px;background:var(--panel);cursor:pointer;display:grid;place-items:center}
.doc li.task input:checked{background:var(--accent)}
.doc li.task input:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.doc li.task.done{color:var(--sub);text-decoration:line-through}
.doc .warnl{color:var(--warn);font-weight:500}
.doc details.orig{margin-top:2.5em;border-top:1px dashed var(--line);padding-top:12px;font-size:14px;line-height:1.65;color:var(--sub)}
.doc details.orig>summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sub);padding:6px 0}
.doc details.orig h1{font-size:19px}.doc details.orig h2{font-size:16px;border:0;padding:0;margin:1.4em 0 .4em}.doc details.orig h2::before{display:none}
.doc details.orig .tw table{font-size:13px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:12px}
/* 보완 남기기 폼 */
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.cbox p{margin:0 0 6px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cform label,.sitgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.cform input,.cform select,.cform textarea,.sitgrid input,.sitgrid select,.askf textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.cform textarea{min-height:120px;resize:vertical;margin-top:10px}
.cform input[type=file]{padding:6px;font-size:13px}
.cform .hint{font-size:12.5px;color:var(--sub);font-weight:400}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.msg{font-size:14px;margin-top:8px}.msg.err{color:var(--bad)}.msg.ok{color:var(--good);font-weight:600}
.citem{display:block;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.citem .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.citem .c{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.citem .note{font-size:13px;color:var(--good);margin-top:4px}
/* 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px}
.tab{padding:9px 14px;text-decoration:none;color:var(--sub);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
details.todo{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;margin:6px 0}
details.todo summary{cursor:pointer;font-weight:600}
details.todo li{font-size:14px;margin:4px 0}
/* 물어보기 */
details.sit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px}
details.sit summary{cursor:pointer;font-weight:600}
.sitgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.sitgrid .wide{grid-column:1/-1}
@media(max-width:600px){.sitgrid{grid-template-columns:1fr 1fr}}
.chat{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.bub{max-width:100%;padding:12px 15px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;max-width:85%;white-space:pre-wrap}
.bub.a{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;line-height:1.7}
.bub.a h3{font-size:15.5px;margin:14px 0 6px}.bub.a p{margin:6px 0}.bub.a ul{padding-left:1.3em}
.bub .refs{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
.bub .refs .chip{font-size:12.5px}
.bub.wait{color:var(--sub)}
.askf{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.askf textarea{resize:vertical;min-height:52px}
.ref-snip{font-size:13px;color:var(--sub);margin-top:2px}
</style>

</head>
<body>
<div class="shell" id="shell">
<button class="toggle" id="toggle" type="button" aria-label="메뉴 숨기기/보이기" title="메뉴 숨기기/보이기">☰</button>
<aside>
  <div class="brand"><b>4&amp;7 NEXT</b><span>HUB</span></div>
  <div class="built" id="built">불러오는 중</div>
  <nav id="nav" aria-label="주 메뉴">
    <a class="navl" data-r="home" href="#home">홈</a>
    <a class="navl" data-r="about" href="#about">이 사이트 이야기<span class="nd">처음이라면 여기부터</span></a>
    <a class="navl" data-r="tool-ap" href="#tool-ap">AP 스크립트 자동작성<span class="nd">업체 넣으면 스크립트·보고서·PPT가 자동으로</span></a>
    <a class="navl" data-r="ask" href="#ask">물어보기<span class="nd">AI에게 컨셉·준비할 것 묻기</span></a>
    <a class="navl" data-r="learn" href="#learn">공부하기<span class="nd">컨셉·화법·상품 익히기</span></a>
    <div class="navs" id="learnSub" hidden></div>
    <a class="navl" data-r="together" href="#together">함께 만들기<span class="nd">보완 남기기 · 보완 필요 목록</span></a>
  </nav>
  <div class="navfoot"><a href="#manual" data-f="manual">사용법</a> · <a href="#rules" data-f="rules">사용 원칙</a> · <a href="#updates" data-f="updates">최근 업데이트</a></div>
</aside>

<main id="main"><div class="wrap" id="view"></div></main>
</div>

<template id="tpl-home">
  <h1>4&amp;7 NEXT 허브</h1>
  <p class="lede">업체 분석, 첫 미팅 준비, 공부를 한곳에서 합니다.</p>
  <a class="row" href="#about" style="margin:0 0 14px;border-color:var(--accent)"><span class="t"><b>처음이세요?</b> 이 사이트 이야기 보기 (3분)</span><span class="d">→</span></a>
  <div class="cards four">
    <a class="card main" href="#tool-ap"><span class="k">1. 미팅 전</span><b>AP 스크립트 자동작성</b><span>업체 정보나 재무제표를 넣으면 컨셉 진단, 미팅 스크립트, 보고서, PPT까지 만듭니다.</span></a>
    <a class="card" href="#ask"><span class="k">2. 궁금할 때</span><b>물어보기</b><span>"이 업체엔 어떤 컨셉부터?" AI에게 물어보세요.</span></a>
    <a class="card" href="#learn"><span class="k">3. 틈날 때</span><b>공부하기</b><span>컨셉 사전, 첫 미팅 화법, 상품 Q&amp;A, 경정기 비교 계산기.</span></a>
    <a class="card" href="#together"><span class="k">4. 같이</span><b>함께 만들기</b><span>고칠 점, 자료, 아이디어를 보내 주세요.</span></a>
  </div>
  <div class="beta"><b>초안 · 보완 필요</b><span>모두 만드는 중입니다. 틀린 곳이 보이면 화면마다 있는 "보완 남기기"로 알려 주세요.</span></div>
  <div class="notice"><b>꼭 지켜 주세요.</b> 고객 실명·연락처는 어디에도 넣지 않습니다. 상품 숫자는 내부 참고용이고, 고객에게는 가입설계서로 안내합니다. 세무 처리는 세무사 검토 사항입니다.</div>
  <p class="small" id="homeStat"></p>
</template>

<template id="tpl-manual">
  <h1>사용법</h1>
  <p class="lede">메뉴는 다섯 개입니다. 필요한 것만 골라 보세요.</p>
  <div class="beta"><b>초안 · 보완 필요</b><span>쓰면서 불편한 점을 "보완 남기기"로 알려 주시면 계속 고칩니다.</span></div>
  <div class="cards">
    <div class="card"><b>AP 스크립트 자동작성</b><span>첫 미팅(AP) 전에 씁니다.</span>

<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const narrow=()=>window.matchMedia('(max-width:860px)').matches;
function setCollapsed(c){$('#shell').classList.toggle('collapsed',c);store.set('hub-collapsed',c?'1':'0')}
$('#toggle').addEventListener('click',()=>setCollapsed(!$('#shell').classList.contains('collapsed')));
if(store.get('hub-collapsed')==='1')$('#shell').classList.add('collapsed');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

let M={docs:[],tools:[]},CFG={endpoint:''},AI=null;
const REPO='xdrygv1-lab/4and7-next-hub';
const TOOLS={'tool-ap':['AP 스크립트 자동작성 (진단·스크립트·보고서·PPT)','tools/ap-generator.html'],'tool-sim':['경정기 비교 계산기','tools/simulator.html']};
const ALIAS={improve:'together',contribute:'together',concept:'concepts'};
const LEARN=[
  {h:'concepts',label:'컨셉 사전',desc:'업체 상황별 컨설팅 컨셉',gids:['concept']},
  {h:'learn-ap',label:'첫 미팅 화법',desc:'AP 15단계, 화법, 반론 대응',gids:['ap']},
  {h:'learn-faq',label:'상품 Q&A',desc:'주력 상품 비교와 자주 묻는 질문',gids:['faq']},
  {h:'learn-guide',label:'신입 가이드',desc:'보험용어, 청약서, 영업 흐름',gids:['guide']},
  {h:'learn-prod',label:'상품 자료',desc:'상품 요약, 약관 정리, 비교표',gids:['prod','prodmet']},
  {h:'tool-sim',label:'경정기 비교 계산기',desc:'나이·금액별 상품 보험료와 환급률 비교',gids:[]},
];
const EXTRA={'learn-example':{h:'learn-example',label:'자동작성 예시',desc:'AP 스크립트 자동작성 결과 예시',gids:['example']}};
const KINDS=['보완 멘트','자료','새 컨셉','오류','아이디어'];
const catOfDoc=d=>LEARN.find(c=>c.gids.includes(d.gid))||Object.values(EXTRA).find(c=>c.gids.includes(d.gid));
const catByHash=h=>LEARN.find(c=>c.h===h)||EXTRA[h];

/* ---------- 보조: GitHub·카톡 (작은 대안) ---------- */
function issueURL(title,where){const body=`### 위치\n${where}\n\n### 무엇이 문제인가요\n\n\n### 어떻게 바뀌면 좋을까요\n\n\n> 고객 이름·회사명·연락처·재무 숫자는 쓰지 마세요.`;return `https://github.com/${REPO}/issues/new?title=${encodeURIComponent('[보완] '+title)}&body=${encodeURIComponent(body)}`}
function kakao(title){return `[4&7 NEXT 보완]\n위치: ${title}\n내용: \n근거: `}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent='복사했습니다'}catch(e){btn.textContent='복사 실패: 직접 적어 주세요'}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copyText(kakao(b.dataset.copy),b)});

/* ---------- 백엔드 ---------- */
const PII=[[/\d{6}\s*-\s*[1-8]\d{6}/,'주민등록번호'],[/\d{3}\s*-\s*\d{2}\s*-\s*\d{5}/,'사업자등록번호'],[/01[016789][\s.-]?\d{3,4}[\s.-]?\d{4}/,'휴대전화번호'],[/\b0(?:2|[3-6][1-5]|70)[\s.-]?\d{3,4}[\s.-]?\d{4}\b/,'전화번호'],[/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/,'이메일 주소']];
function piiFound(t){return PII.filter(([rx])=>rx.test(t)).map(p=>p[1])}
async function api(body){const r=await fetch(CFG.endpoint,{method:'POST',body:JSON.stringify(body)});return r.json()}
async function apiGet(q){const r=await fetch(CFG.endpoint+(CFG.endpoint.includes('?')?'&':'?')+q,{cache:'no-store'});return r.json()}
async function aiReady(){if(!CFG.endpoint)return false;if(AI!==null)return AI;try{const r=await apiGet('action=ping');AI=!!(r&&r.ok&&r.ai)}catch(e){AI=false}return AI}

/* ---------- 보완 남기기 상자 ---------- */
function contribBox(target,opt={}){

    box.innerHTML=`<p><b>로그인 없이 바로 보내는 기능은 준비 중입니다.</b> (연결하면 켜집니다) 지금은 문구를 복사해 개발팀 단톡방에 보내 주세요. 파일도 단톡방에 함께 올리면 됩니다.</p><div class="btnrow" style="margin-top:8px"><button class="btn p" type="button" data-copy="${esc(where)}">카톡용 문구 복사</button><a class="btn sm" target="_blank" rel="noopener" href="${issueURL(where,where)}">GitHub로 보내기 (계정 필요)</a></div>`;
    return box}
  const kind=opt.kind||'보완 멘트';
  const titles=M.docs.map(d=>d.title);
  box.innerHTML=`<form class="cform" novalidate>
    <div class="frow">
      <label>종류<select name="kind">${KINDS.map(k=>`<option ${k===kind?'selected':''}>${k}</option>`).join('')}</select></label>
      ${target?`<label>대상<input value="${esc(target)}" disabled></label>`:`<label>어느 문서·도구에 대한 건가요? <input name="tgt" list="dlTitles" placeholder="비워 두면 전체"><datalist id="dlTitles"><option>AP 스크립트 자동작성</option><option>경정기 비교 계산기</option><option>물어보기</option>${titles.map(t=>`<option>${esc(t)}</option>`).join('')}</datalist></label>`}
      <label>닉네임 (선택)<input name="alias" maxlength="30" placeholder="예: 세무사 A"></label>
    </div>
    <label style="margin-top:10px">내용 <span class="hint">${esc(opt.hint||'무엇을, 어떻게 바꾸면 좋을지 적어 주세요. 근거가 있으면 함께.')}</span><textarea name="content" maxlength="5000" required></textarea></label>

        box.querySelector('button').onclick=()=>box.replaceWith(contribBox(target,opt));if(opt.onSent)opt.onSent()}
      else{msg.className='msg err';msg.textContent=(r&&r.error)||'보내지 못했습니다.';btn.disabled=false}

  });
  return box}
function readB64(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(r.error);r.readAsDataURL(file)})}

function situation(){const parts=[...document.querySelectorAll('[data-s]')].map(x=>x.value.trim()?`${x.dataset.s}: ${x.value.trim()}`:'').filter(Boolean);return parts.length?'[업체 상황] '+parts.join(', '):''}
function bigrams(s){const out=new Set();(String(s).toLowerCase().match(/[가-힣a-z0-9]+/g)||[]).forEach(w=>{if(/^[a-z0-9]+$/.test(w)){if(w.length>=2)out.add(w);return}for(let i=0;i<w.length-1;i++)out.add(w.slice(i,i+2))});return out}
let IDX=null;
async function buildIndex(){if(IDX)return IDX;
  const cand=M.docs.filter(d=>['concept','ap','faq'].includes(d.gid));
  const rows=await Promise.all(cand.map(async d=>{try{const t=easyPart(await docText(d));return {d,t,ti:bigrams(d.title+' '+(d.concept||'')),hd:bigrams(t.slice(0,2000))}}catch(e){return null}}));
  const list=rows.filter(Boolean),df=new Map();
  list.forEach(r=>new Set([...r.ti,...r.hd]).forEach(b=>df.set(b,(df.get(b)||0)+1)));
  IDX={list,df,N:list.length};return IDX}
async function retrieve(q){const ix=await buildIndex(),Q=bigrams(q);
  const scored=ix.list.map(r=>{let s=0;Q.forEach(b=>{const idf=Math.log((ix.N+1)/((ix.df.get(b)||0)+1));if(idf<=0.2)return;if(r.ti.has(b))s+=3*idf;if(r.hd.has(b))s+=idf});return {r,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const top=scored.slice(0,4);const best=top[0]?top[0].s:0;
  return top.filter(x=>x.s>=best*0.35).map(x=>x.r)}
function snippet(t){const m=t.match(/>\s*\*\*한눈에\*\*\s*([^\n]+)/);const s=(m?m[1]:t.replace(/^#.*$/m,'')).replace(/[#>*|`_]/g,' ').replace(/\s+/g,' ').trim();return s.length>120?s.slice(0,120)+'…':s}
function addBub(cls,html){const b=document.createElement('div');b.className='bub '+cls;b.innerHTML=html;$('#chat').appendChild(b);b.scrollIntoView({behavior:'smooth',block:'nearest'});return b}
function refsHtml(refs,label){return refs.length?`<div class="refs">${label}<div class="chips">${refs.map(r=>`<a class="chip" href="#${r.d.id}">${esc(r.d.title)}</a>`).join('')}</div></div>`:''}
async function showAsk(){tpl('tpl-ask');HIST=[];
  $('#exq').innerHTML=EXQ.map(q=>`<button class="chip" type="button">${esc(q)}</button>`).join('');
  $('#exq').onclick=e=>{const b=e.target.closest('.chip');if(b){$('#askq').value=b.textContent;$('#askq').focus()}};
  const st=$('#askState');
  const ready=await aiReady();
  if(!$('#askState'))return;
  st.innerHTML=ready?'<b>AI 연결됨</b><span>답은 참고용입니다. 질문과 관련된 컨셉 문서를 함께 보여 드립니다.</span>'
    :'<b>AI 상담은 준비 중 (연결하면 켜집니다)</b><span>지금은 질문과 관련 있는 컨셉·화법·상품 문서를 찾아 드립니다. 그것만으로도 시작하기 좋습니다.</span>';
  const q=$('#askq');
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#askf').requestSubmit()}});
  $('#askReset').onclick=()=>{HIST=[];$('#chat').innerHTML=''};
  $('#askf').addEventListener('submit',async e=>{e.preventDefault();const text=q.value.trim();if(!text)return;
    const sit=situation(),full=(sit?sit+'\n':'')+text;
    const pii=piiFound(full);if(pii.length){addBub('a',`<p class="msg err">개인정보로 보이는 내용(${esc(pii.join(', '))})이 있어 보내지 않았습니다. 지우고 다시 물어봐 주세요.</p>`);return}
    q.value='';addBub('u',esc(full));const btn=$('#askBtn');btn.disabled=true;
    const wait=addBub('a wait','관련 문서를 찾는 중…');
    let refs=[];try{refs=await retrieve(full+' '+HIST.filter(m=>m.role==='user').slice(-1).map(m=>m.content).join(' '))}catch(err){}
    if(!(await aiReady())){
      wait.className='bub a';
      wait.innerHTML=refs.length?`<p><b>AI 상담은 준비 중입니다.</b> (연결하면 켜집니다) 대신 질문과 관련 있는 문서를 찾았어요. 맨 위 "한눈에"와 "꼭 확인할 것"부터 보세요.</p><div class="list">${refs.map(r=>`<a class="row" href="#${r.d.id}"><span class="t">${esc(r.d.title)}<div class="ref-snip">${esc(snippet(r.t))}</div></span></a>`).join('')}</div>`
        :'<p><b>AI 상담은 준비 중입니다.</b> 관련 문서를 찾지 못했어요. <a href="#concepts">컨셉 사전</a>에서 둘러보거나 낱말을 바꿔 물어봐 주세요.</p>';
      btn.disabled=false;return}
    wait.textContent='답을 만드는 중입니다… (10~30초)';
    try{const r=await api({action:'ask',question:full,context:refs.map(x=>({title:x.d.title,text:x.t.slice(0,2500)})),history:HIST.slice(-6)});
      wait.className='bub a';
      if(r&&r.ok){wait.innerHTML=md(String(r.answer).replace(/</g,'&lt;'))+refsHtml(refs,'참고한 컨셉');HIST.push({role:'user',content:full},{role:'assistant',content:r.answer})}
      else{if(r&&(r.code==='no_key'))AI=false;wait.innerHTML=`<p class="msg err">${esc((r&&r.error)||'답을 받지 못했습니다.')}</p>`+refsHtml(refs,'대신 이 문서를 보세요')}
    }catch(err){wait.className='bub a';wait.innerHTML='<p class="msg err">연결에 실패했습니다. 잠시 후 다시 시도해 주세요.</p>'+refsHtml(refs,'대신 이 문서를 보세요')}
    btn.disabled=false})}

window.addEventListener('hashchange',show);
Promise.all([
  fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
  fetch('config.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([m,c])=>{if(m)M=m;CFG={endpoint:String((c&&c.endpoint)||'').trim()};
  $('#built').textContent=m?`업데이트 ${m.built}`:'목록을 불러오지 못했습니다';show()});
</script>
