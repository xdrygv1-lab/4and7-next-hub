<div id="g47" style="position:fixed;inset:0;z-index:2147483000;background:#f4f6f5;display:grid;place-items:center;font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif">
  <form id="g47f" style="background:#fff;border:1px solid #dfe5e2;border-radius:16px;padding:28px 26px;width:min(340px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.06)">
    <div style="font-weight:800;font-size:20px;color:#1f3d36">4&amp;7 NEXT</div>
    <div style="color:#5f6b66;font-size:14px;margin:6px 0 16px">팀 비밀번호를 넣어 주세요. 한 번 넣으면 이 기기에서 기억합니다.</div>
    <input id="g47p" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd8d4;border-radius:10px;font-size:16px">
    <button type="submit" style="margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:#1f6f5c;color:#fff;font-size:15px;font-weight:700;cursor:pointer">들어가기</button>
    <div id="g47m" style="color:#c0392b;font-size:13px;margin-top:8px;min-height:1em"></div>
  </form>
</div>
<script>(function(){var K='team_pass',CFG='config.json',g=document.getElementById('g47'),m=document.getElementById('g47m'),v='';
try{v=localStorage.getItem(K)||''}catch(e){}
function ep(){return fetch(CFG,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){return String(j.endpoint||'').trim()}).catch(function(){return ''})}
function check(p){return ep().then(function(e){if(!e)return null;return fetch(e+'?action=passcheck&pass='+encodeURIComponent(p)+'&r='+Date.now()).then(function(r){return r.json()}).then(function(j){return !!j.ok}).catch(function(){return null})})}
if(v){g.style.display='none';check(v).then(function(ok){if(ok===false){try{localStorage.removeItem(K)}catch(e){}g.style.display='grid';m.textContent='비밀번호가 바뀌었어요. 다시 넣어 주세요.'}})}
else setTimeout(function(){var i=document.getElementById('g47p');if(i)i.focus()},50);
document.getElementById('g47f').addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('g47p').value.trim();if(!p)return;m.style.color='#5f6b66';m.textContent='확인 중…';
  check(p).then(function(ok){if(ok===false){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않아요.';return}
    if(ok===null){m.style.color='#c0392b';m.textContent='연결하지 못했어요. 잠시 후 다시 시도해 주세요.';return}
    try{localStorage.setItem(K,p)}catch(e){}g.style.display='none';try{location.reload()}catch(e){}})});
})();</script>

.chat{display:flex;flex-direction:column;gap:12px;margin:16px 0}

.askf{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.askf textarea{resize:vertical;min-height:52px}
.ref-snip{font-size:13px;color:var(--sub);margin-top:2px}

<template id="tpl-how">
  <h1>이 사이트는 이렇게 만들어졌어요</h1>
  <p class="lede">우리가 가진 교육자료·컨셉·상품 자료와 회사 공개 자료를 AI가 읽고, 정해 둔 기준으로 판단해서 <b>미팅 준비 초안</b>을 만듭니다. 사람은 확인하고 고치기만 하면 됩니다.</p>
  <div class="btnrow" style="margin:0 0 18px"><a class="btn p" href="#demo">3분 시연 먼저 보기</a><a class="btn" href="#tool-ap">직접 써 보기</a></div>

  <h2>왜 만들었나요</h2>
  <div class="cards">
    <div class="card"><b>준비 시간을 줄이려고</b><span>업체 하나 분석하고 AP·PC를 준비하는 데 오래 걸리던 일을, 사업자번호로 불러와 초안까지 빠르게.</span></div>
    <div class="card"><b>잘 통한 방법을 누구나 쓰게</b><span>현장에서 통한 화법·사례·컨셉 판단을 한곳에 모아, 경력이 짧아도 같은 수준으로 준비할 수 있게.</span></div>
    <div class="card"><b>숫자로 대화하려고</b><span>"좋은 상품 있어요"가 아니라 "대표님 회사 가치가 10년 뒤 얼마"로 시작하는 미팅.</span></div>
  </div>

  <h2>한 업체가 지나가는 길</h2>
  <div class="flow">
    <div class="st"><h3>업체자료 불러오기</h3><dl><dt>무엇으로</dt><dd>리치 CRM(KoData 재무 3년), 전자공시, 인터넷 공개 정보(선택·유료)</dd><dt>어떻게</dt><dd>사업자번호·대표자명·상호명을 넣으면 자동으로 찾아 채움</dd></dl><div class="up">정보제공 동의를 받은 업체만 CRM에 등록합니다</div></div>
    <div class="st"><h3>업체 분석 (신호등 8가지)</h3><dl><dt>무엇으로</dt><dd>재무 숫자 + 체크한 상황</dd><dt>어떻게</dt><dd>회사 가치·잉여금·급여배당·퇴직금·가지급금·유고자금·주주·상속세를 빨강/주황/초록으로. 자료가 없으면 회색</dd></dl><div class="up">→ 실제 사례가 쌓일수록 <b>색 기준이 정확해져요</b></div></div>
    <div class="st"><h3>컨셉 진단</h3><dl><dt>무엇으로</dt><dd>공부하기의 컨셉 카드 50여 개</dd><dt>어떻게</dt><dd>카드마다 적힌 "이런 업체에 맞다" 신호와 대조해 1~3순위</dd></dl><div class="up">→ 계약·보류 사례가 들어가면 <b>순위가 정교해져요</b></div></div>
    <div class="st"><h3>첫 미팅(AP) 스크립트</h3><dl><dt>무엇으로</dt><dd>AP 15단계 표준, 화법·반론 자료</dd><dt>어떻게</dt><dd>업체 상황에 맞춰 단계별 멘트, 상품명 금지어 검사, 대략 점수</dd></dl><div class="up">→ 실제 녹음이 들어가면 <b>현장 말투</b>가 돼요</div></div>
    <div class="st"><h3>제안(PC) 준비</h3><dl><dt>무엇으로</dt><dd>PC 준비 표준, 컨셉별 제안 순서, 실제 보류·철회 사례</dd><dt>어떻게</dt><dd>제안서 순서·계산·반론·클로징, 금액 세 안, 제안 전 신호, 재정심사 미리 보기</dd></dl><div class="up">→ 정식 재정심사 기준이 오면 <b>금액이 실제와 맞아요</b></div></div>
    <div class="st"><h3>제안 PPT</h3><dl><dt>무엇으로</dt><dd>위 분석 결과</dd><dt>어떻게</dt><dd>네이비·골드 디자인, 그래프, 장마다 발표 스크립트(발표자 메모)</dd></dl><div class="up">→ 잘 만든 PPT 원본이 오면 <b>그 모양 그대로</b></div></div>
  </div>

  <h2>뒤에서 돌아가는 것</h2>
  <div class="tw"><table><thead><tr><th>무엇</th><th>하는 일</th></tr></thead><tbody>
    <tr><td>이 사이트</td><td>링크만 있으면 누구나 여는 웹페이지. 휴대폰에서도 열려요</td></tr>
    <tr><td>저장 서버 (구글)</td><td>바로 고치기·AI에게 가르치기 저장, AI·공시·CRM 연결 창구. 첨부 파일은 비공개 드라이브에</td></tr>
    <tr><td>AI (Claude)</td><td>물어보기, 자동작성, 인터넷 검색. 하루·한 달 사용 한도가 걸려 있어요</td></tr>
    <tr><td>CRM 조회 도우미</td><td>관리자 PC에서 리치 CRM을 대신 조회. 요청하면 1~3분, 새로 등록한 회사는 20분쯤</td></tr>
    <tr><td>매일 밤 학습</td><td>밤 11시에 "AI에게 가르치기"로 들어온 자료를 읽고 사이트에 반영</td></tr>
    <tr><td>상품 비교 데이터</td><td>매주 월요일 자동으로 새 기준을 확인</td></tr>
  </tbody></table></div>

  <h2>AI가 하는 일, 사람이 하는 일</h2>
  <div class="cards">
    <div class="card"><b>AI</b><span>자료를 찾아 모으고, 기준대로 판단하고, 초안(보고서·스크립트·PPT)을 씁니다. 받은 자료로 매일 배웁니다.</span></div>
    <div class="card"><b>사람</b><span>숫자와 사실을 확인하고, 고객에 맞게 고치고, 세무 판단은 세무사가, 금액은 가입설계서·재정심사로 확정합니다. 그리고 <b>자료를 보태 AI를 가르칩니다.</b></span></div>
  </div>
  <p class="small">자료를 보태는 방법은 <a href="#home">홈 화면 "자료 올리는 법"</a>에 있어요.</p>
</template>

<template id="tpl-demo">
  <h1>3분 시연: 가상의 회사로 따라가 보기</h1>
  <p class="lede"><b>가나정밀(주)</b>라는 가상의 제조업 법인으로 처음부터 PPT까지 따라가 봅니다. 회사 이름과 숫자는 모두 지어낸 것입니다.</p>
  <div class="demo">
    <figure><img loading="lazy" src="img/demo/1_load.jpg" alt="업체자료 불러오기 화면"><figcaption><b>1. 업체자료 불러오기</b>사업자등록번호·대표자명·상호명 세 칸을 채우면 "불러오기"가 켜집니다. 옆의 초록 불은 CRM 조회가 가능하다는 표시예요. 인터넷 검색은 필요할 때만 체크(유료).</figcaption></figure>
    <figure><img loading="lazy" src="img/demo/2_report.jpg" alt="업체 분석 보고서"><figcaption><b>2. 업체 분석 보고서</b>CRM에서 가져온 3년 재무로 신호등 8가지를 매깁니다. 이 회사는 빨강 5개: 회사 가치, 잉여금, 퇴직금, 유고 자금, 상속세. 3년 흐름과 매출 증가율도 같이 나와요.</figcaption></figure>
    <figure><img loading="lazy" src="img/demo/3_issue.jpg" alt="이슈별 한 장"><figcaption><b>3. 이슈별 한 장</b>빨강·주황 이슈마다 "지금 상황 / 그대로 두면 / 해결 방향 / 필요한 자료"를 정리합니다. 위 "인쇄 · PDF 저장"으로 그대로 출력돼요.</figcaption></figure>
    <figure><img loading="lazy" src="img/demo/4_ap.jpg" alt="AP 스크립트"><figcaption><b>4. 첫 미팅(AP) 스크립트</b>15단계 멘트가 이 회사 상황에 맞춰 나옵니다. 인터넷에서 찾은 "2공장 증설" 소식이 첫 인사에, 만들어진 질문이 니즈 질문에 들어갔어요. <code>[ ]</code>는 대표님께 물어서 받을 숫자입니다.</figcaption></figure>
    <figure><img loading="lazy" src="img/demo/5_pc.jpg" alt="PC 준비"><figcaption><b>5. 제안(PC) 준비</b>제안 전 확인할 신호, 1·2순위 컨셉별 제안서 순서·계산·준비 자료·예상 반론·클로징 한 문장. 아래로 내리면 금액 세 안, 재정심사 미리 보기, 현장 화법, 청약·사후관리 체크가 이어집니다.</figcaption></figure>

<script>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

let M={docs:[],tools:[]},CFG={endpoint:''},AI=null;
const REPO='xdrygv1-lab/4and7-next-hub';
const TOOLS={'tool-ap':['업체 분석 → 제안 준비','tools/ap-generator.html'],'tool-sim':['경정기 비교 계산기','tools/simulator.html']};

const LEARN=[
  {h:'concepts',label:'컨셉 사전',desc:'업체 상황별 컨설팅 컨셉',gids:['concept']},

  {h:'learn-guide',label:'신입 가이드',desc:'보험용어, 청약서, 영업 흐름',gids:['guide']},
  {h:'learn-prod',label:'상품 자료',desc:'상품 요약, 약관 정리, 비교표',gids:['prod','prodmet']},
  {h:'tool-sim',label:'경정기 비교 계산기',desc:'나이·금액별 상품 보험료와 환급률 비교',gids:[]},
];

/* ---------- 보조: GitHub·카톡 (작은 대안) ---------- */
function issueURL(title,where){const body=`### 위치\n${where}\n\n### 무엇이 문제인가요\n\n\n### 어떻게 바뀌면 좋을까요\n\n\n> 고객 이름·회사명·연락처·재무 숫자는 쓰지 마세요.`;return `https://github.com/${REPO}/issues/new?title=${encodeURIComponent('[보완] '+title)}&body=${encodeURIComponent(body)}`}
function kakao(title){return `[4&7 NEXT 보완]\n위치: ${title}\n내용: \n근거: `}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent='복사했습니다'}catch(e){btn.textContent='복사 실패: 직접 적어 주세요'}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copyText(kakao(b.dataset.copy),b)});

/* ---------- 백엔드 ---------- */
const PII=[[/\d{6}\s*-\s*[1-8]\d{6}/,'주민등록번호'],[/\d{3}\s*-\s*\d{2}\s*-\s*\d{5}/,'사업자등록번호'],[/01[016789][\s.-]?\d{3,4}[\s.-]?\d{4}/,'휴대전화번호'],[/\b0(?:2|[3-6][1-5]|70)[\s.-]?\d{3,4}[\s.-]?\d{4}\b/,'전화번호'],[/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/,'이메일 주소']];
function piiFound(t){return PII.filter(([rx])=>rx.test(t)).map(p=>p[1])}
async function api(body){const r=await fetch(CFG.endpoint,{method:'POST',body:JSON.stringify(body)});return r.json()}
async function apiGet(q){const r=await fetch(CFG.endpoint+(CFG.endpoint.includes('?')?'&':'?')+q,{cache:'no-store'});return r.json()}
async function aiReady(){if(!CFG.endpoint)return false;if(AI!==null)return AI;try{const r=await apiGet('action=ping');AI=!!(r&&r.ok&&r.ai)}catch(e){AI=false}return AI}

/* ---------- AI에게 가르치기 상자 ---------- */

    return box}
  const kind=opt.kind||'학습 요청';
  box.classList.add('teach');
  box.innerHTML=`<div class="chat" data-chat><div class="bub a">무엇을 가르쳐 줄래요? 자료를 올리거나, 바꾸고 싶은 내용을 그냥 말하듯 적어 주세요.${target?`<br><span class="small">대상: ${esc(target)}</span>`:''}</div></div>
   <form class="cform" novalidate>
    <textarea name="content" maxlength="5000" required placeholder="예) 첨부한 PPT로 보고서 양식을 배워 줘&#10;예) 사근복 컨셉에 '직원들이 싫어해요' 반론과 대응을 넣어 줘&#10;예) 이 녹음으로 우리 지점 AP 화법을 배워 줘${opt.hint?'&#10;'+esc(opt.hint):''}"></textarea>
    <div class="btnrow" style="margin-top:8px;align-items:center"><label class="btn sm" style="cursor:pointer">파일 첨부<input type="file" name="file" hidden></label><span class="small" data-fname>PPT·PDF·엑셀·한글·이미지·녹음 (30MB까지, 더 큰 녹음은 드라이브 링크를 붙여 주세요)</span></div>
    <div class="hp" aria-hidden="true"><label>웹사이트<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <p class="hint" style="margin-top:8px">⚠ 고객 이름·회사명·연락처·주민번호·사업자번호는 지워 주세요. 올린 파일은 관리자만 볼 수 있게 저장됩니다.</p>
    <div class="btnrow" style="margin-top:8px"><button class="btn p" type="submit">AI에게 보내기</button><span class="msg" data-msg role="status"></span></div>
   </form>`;
  const f=box.querySelector('form'),ta=f.content,msg=box.querySelector('[data-msg]'),chat=box.querySelector('[data-chat]');
  f.file.addEventListener('change',()=>{const x=f.file.files[0];box.querySelector('[data-fname]').textContent=x?`첨부: ${x.name}`:''});
  f.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';
    const content=ta.value.trim(),tgt=target||'전체',file=f.file.files[0];
    if(content.length<5&&!file){msg.className='msg err';msg.textContent='무엇을 가르칠지 조금만 더 적어 주세요.';ta.focus();return}
    const pii=piiFound([content,file?file.name:''].join('\n'));
    if(pii.length){msg.className='msg err';msg.textContent=`개인정보로 보이는 내용(${pii.join(', ')})이 있습니다. 지우고 다시 보내 주세요.`;return}
    if(file&&file.size>30*1024*1024){msg.className='msg err';msg.textContent='파일은 30MB까지 보낼 수 있습니다. 큰 녹음은 구글 드라이브 공유 링크를 붙여 주세요.';return}
    if(!CFG.endpoint){msg.className='msg err';msg.innerHTML='지금은 연결 준비 중이에요. <button class="linkbtn" type="button" data-copy="'+esc(tgt)+'">카톡용 문구 복사</button>';return}
    const btn=f.querySelector('button[type=submit]');btn.disabled=true;
    chat.insertAdjacentHTML('beforeend',`<div class="bub u">${esc(content||'(파일만 보냄)')}${file?`<br><span class="small">📎 ${esc(file.name)}</span>`:''}</div><div class="bub a" data-wait>${file?'파일을 받는 중이에요…':'읽는 중이에요…'}</div>`);
    const wait=chat.querySelector('[data-wait]');f.hidden=true;
    try{
      const body={action:'contrib',kind,target:tgt,content:content||'(첨부 파일 학습 요청)',alias:'',website:f.website.value};
      if(file)body.file={name:file.name,mimeType:file.type||'application/octet-stream',base64:await readB64(file)};
      const r=await api(body);wait.removeAttribute('data-wait');
      if(r&&r.ok){wait.innerHTML=esc(r.message||'고마워요. 오늘 밤 학습해서 반영할게요.').replace(/\n/g,'<br>');
        chat.insertAdjacentHTML('afterend','<div class="btnrow" style="margin-top:8px"><button class="btn sm" type="button" data-more>더 가르치기</button></div>');
        box.querySelector('[data-more]').onclick=()=>box.replaceWith(contribBox(target,opt));if(opt.onSent)opt.onSent()}
      else{wait.innerHTML='<span class="msg err">'+esc((r&&r.error)||'보내지 못했습니다.')+'</span>';f.hidden=false;btn.disabled=false}
    }catch(err){wait.removeAttribute('data-wait');wait.innerHTML='<span class="msg err">보내지 못했습니다. 인터넷 연결을 확인해 주세요.</span>';f.hidden=false;btn.disabled=false}
  });
  return box}
function readB64(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(r.error);r.readAsDataURL(file)})}
function statusPill(s){s=s||'접수';const c={'반영 완료':'good','검토 중':'warn','보류':''}[s];const t={'접수':'배우는 중','검토 중':'확인 중','반영 완료':'배웠어요','보류':'보류'}[s]||s;return `<span class="pill ${c==null?'':c}">${esc(t)}</span>`}
async function loadContribs(el,target,empty){
  if(!el)return;
  if(!CFG.endpoint){el.innerHTML='<div class="row"><span class="t small">바로 보내기 기능이 연결되면 들어온 내용이 여기에 보입니다.</span></div>';return}
  el.innerHTML='<div class="row"><span class="t small">불러오는 중</span></div>';
  try{const r=await apiGet('action=list'+(target?'&target='+encodeURIComponent(target):''));
    const it=(r&&r.items)||[];
    el.innerHTML=it.length?it.map(i=>`<div class="citem"><div class="top">${statusPill(i.status)}<span class="pill">${esc(i.kind)}</span>${target?'':`<span>${esc(i.target)}</span>`}<span>${esc(i.time)}</span>${i.hasFile?'<span>파일 첨부</span>':''}</div><div class="c">${esc(i.content.length>400?i.content.slice(0,400)+'…':i.content)}</div>${i.note?`<div class="note"><b>AI가 배운 것</b> ${esc(i.note)}</div>`:''}</div>`).join('')
      :`<div class="row"><span class="t small">${esc(empty||'아직 없습니다. 첫 보완을 남겨 주세요.')}</span></div>`}
  catch(e){el.innerHTML='<div class="row"><span class="t small">목록을 불러오지 못했습니다. 잠시 후 다시 열어 보세요.</span></div>'}}

/* ---------- 메뉴 ---------- */
function familyOf(h){
  if(h==='home'||h==='about'||h==='tool-ap'||h==='ask')return h;
  if(h==='how'||h==='demo')return 'how';
  if(h==='together'||h==='todo')return 'together';
  if(h==='learn'||catByHash(h))return 'learn';
  const d=M.docs.find(x=>x.id===h);if(d)return 'learn';
  return ''}
function renderNav(h){
  const fam=familyOf(h),d=M.docs.find(x=>x.id===h),cur=d?(catOfDoc(d)||{}).h:h;
  document.querySelectorAll('#nav > .navl').forEach(a=>a.classList.toggle('on',a.dataset.r===fam));
  const sub=$('#learnSub');sub.hidden=fam!=='learn';
  sub.innerHTML=LEARN.map(c=>`<a class="navl ${c.h===cur?'on':''}" href="#${c.h}">${esc(c.label)}</a>`).join('');
  document.querySelectorAll('.navfoot a').forEach(a=>a.classList.toggle('on',a.dataset.f===h))}

function tpl(id){$('#main').classList.remove('toolmode');$('#main').innerHTML='<div class="wrap" id="view"></div>';$('#view').appendChild($('#'+id).content.cloneNode(true))}
function docRows(ds){return ds.map(d=>`<a class="row" href="#${d.id}"><span class="t">${esc(d.title)}</span><span class="d">${d.updated}</span></a>`).join('')}

/* ---------- 화면 ---------- */

  if(narrow())setCollapsed(true);
  const main=$('#main');
  if(TOOLS[h]){const[t,src]=TOOLS[h];main.classList.add('toolmode');
    main.innerHTML=`<div class="toolbar"><b>${t} <span class="pill">초안 · 보완 필요</span></b><span class="btnrow" style="margin:0"><a class="btn" href="${src}" target="_blank" rel="noopener">새 창으로</a><button class="btn p" type="button" id="tpBtn">AI에게 가르치기</button></span></div><div class="toolpanel" id="tp" hidden></div><iframe class="frame" src="${src}?v=${encodeURIComponent((M&&M.built)||Date.now())}" title="${t}"></iframe>`;
    const name=h==='tool-ap'?'업체 분석 → 제안 준비':'경정기 비교 계산기';
    $('#tp').appendChild(contribBox(name,{kind:'오류',hint:'어느 탭에서 무엇이 이상했는지, 어떻게 바뀌면 좋을지 적어 주세요.'}));
    $('#tpBtn').onclick=()=>{$('#tp').hidden=!$('#tp').hidden;$('#tpBtn').textContent=$('#tp').hidden?'AI에게 가르치기':'닫기'};return}
  if(h==='home'){tpl('tpl-home');$('#homeStat').innerHTML=`업데이트 ${esc(M.built||'')} · 문서 ${M.docs.length}개 · <a href="#manual">사용법 보기</a>`;return}
  if(h==='manual'){tpl('tpl-manual');return}
  if(h==='how'){tpl('tpl-how');return}
  if(h==='demo'){tpl('tpl-demo');return}

  const cat=catByHash(h);
  if(cat){tpl('tpl-rules');const ds=M.docs.filter(d=>cat.gids.includes(d.gid));
    $('#view').innerHTML=`<div class="crumb"><a href="#learn">공부하기</a> › ${esc(cat.label)}</div><h1>${esc(cat.label)}</h1><p class="lede">${esc(cat.desc)}</p><div class="list">${docRows(ds)||'<div class="row"><span class="t">문서가 없습니다.</span></div>'}</div>`;return}
  const d=M.docs.find(x=>x.id===h);

  return showDoc(d)}

const TEXT=new Map();
/* ---------- 바로 고치기 (링크에 들어온 누구나, 저장 즉시 반영, 기록 보관) ---------- */
const ORIG=new Map(),EDINFO={};let EDITED_P=null;
function loadEdited(){if(!CFG.endpoint)return Promise.resolve({});return EDITED_P||(EDITED_P=apiGet('action=edited').then(r=>(r&&r.items)||{}).catch(()=>({})))}
async function origText(d){if(ORIG.has(d.id))return ORIG.get(d.id);const r=await fetch(d.file);if(!r.ok)throw new Error(r.status);const t=await r.text();ORIG.set(d.id,t);return t}
async function docText(d){if(TEXT.has(d.id))return TEXT.get(d.id);let t=null;
  if(CFG.endpoint){const ed=await loadEdited();if(ed[d.id]){try{const r=await apiGet('action=doc&id='+d.id);if(r&&r.text){t=r.text;EDINFO[d.id]={time:r.time,alias:r.alias}}}catch(e){}}}
  if(t==null)t=await origText(d);TEXT.set(d.id,t);return t}
function editedBadge(d){const el=$('#edInfo');if(!el)return;el.innerHTML='';return;const e=EDINFO[d.id];
  el.innerHTML=e?`<span class="pill warn">수정됨 ${esc(e.time)}${e.alias?' · '+esc(e.alias):''}</span> <button class="linkbtn" type="button" id="hBtn">수정 기록</button>`:'';
  const hb=$('#hBtn');if(hb)hb.onclick=()=>openHistory(d)}
function rerender(d){TEXT.delete(d.id);show()}
async function saveText(d,text,alias,note,prevLen,hp){
  const pii=piiFound(text+'\n'+alias);if(pii.length)return{ok:false,error:`개인정보로 보이는 내용(${pii.join(', ')})이 있습니다. 지우고 다시 저장해 주세요.`};
  return api({action:'edit',id:d.id,title:d.title,text,alias,note,prevLen,website:hp||''})}
async function openEditor(d){const w=$('#eWrap');if(w.firstChild){w.innerHTML='';$('#eBtn').textContent='바로 고치기';return}
  $('#eBtn').textContent='고치기 닫기';const cur=await docText(d);

    <div class="etabs"><button type="button" class="chip on" data-m="w">고치기</button><button type="button" class="chip" data-m="p">미리보기</button></div>
    <textarea class="etext" spellcheck="false" aria-label="문서 본문"></textarea><div class="doc epv" hidden></div>

    <div class="hp" aria-hidden="true"><label>웹사이트<input class="ehp" tabindex="-1" autocomplete="off"></label></div>

    <div class="btnrow"><button class="btn p" type="button" data-save>저장하고 바로 반영</button><button class="btn" type="button" data-cancel>취소</button><span class="msg" data-msg role="status"></span></div></div>`;

        if(r&&r.ok){TEXT.set(d.id,text);EDINFO[d.id]={time:r.time||'방금',alias:''};EDITED_P=null;w.innerHTML='';show();toast('되돌렸습니다.')}else{msg.className='msg err';msg.textContent=(r&&r.error)||'되돌리지 못했습니다.';b.disabled=false}}

  catch(e){w.innerHTML='<div class="cbox">수정 기록을 불러오지 못했습니다.</div>'}}
async function copyRaw(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent='복사했습니다'}catch(e){btn.textContent='복사 실패'}}
function toast(t){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),3500)}

// 물결(~)은 범위 표시로 쓰므로 취소선으로 바뀌지 않게 막는다
const md=t=>marked.parse(t.replace(/~/g,'\\~'));
const easyPart=t=>t.split('<details class="orig">')[0];

    el.innerHTML=d.file.endsWith('.md')&&window.marked?md(t):`<pre style="white-space:pre-wrap">${esc(t)}</pre>`;

function enhanceDoc(el,d){
  el.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tw';tb.parentNode.insertBefore(w,tb);w.appendChild(tb)});
  el.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(/경정기_시뮬레이터_v1\.html/.test(href))a.setAttribute('href','tools/simulator.html'+(href.split('?')[1]?'?'+href.split('?')[1]:''));else if(/AP_스크립트_생성기/.test(href))a.setAttribute('href','#tool-ap')});
  const inOrig=n=>!!n.closest('details.orig');
  // 한눈에 카드, 말하기 말풍선
  let first=true;
  el.querySelectorAll('blockquote').forEach(b=>{if(inOrig(b))return;if(first&&/한눈에/.test(b.textContent.slice(0,20))){b.classList.add('glance')}else b.classList.add('say');first=false});
  // ⚠ 주의 줄
  el.querySelectorAll('li,p').forEach(n=>{if(/^\s*⚠/.test(n.textContent))n.classList.add('warnl')});
  // 체크리스트 (문서별 저장)
  const key='hub-chk:'+d.id;let saved=[];try{saved=JSON.parse(store.get(key)||'[]')}catch(e){}
  el.querySelectorAll('li input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;cb.removeAttribute('disabled');const li=cb.closest('li');li.classList.add('task');
    cb.setAttribute('aria-label','확인 표시');cb.checked=saved.includes(i);li.classList.toggle('done',cb.checked);
    cb.addEventListener('change',()=>{li.classList.toggle('done',cb.checked);const all=[...el.querySelectorAll('li.task input')];store.set(key,JSON.stringify(all.map((x,j)=>x.checked?j:-1).filter(j=>j>=0)))})});
  // 목차
  const hs=[...el.querySelectorAll('h2')].filter(h=>!inOrig(h));
  if(hs.length>=3){$('#toc').innerHTML=hs.map((h,i)=>{h.id='sec-'+i;return `<button class="chip" type="button" data-sec="${i}">${esc(h.textContent)}</button>`}).join('');
    $('#toc').onclick=e=>{const b=e.target.closest('[data-sec]');if(b){const t=document.getElementById('sec-'+b.dataset.sec);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}}}
  // 읽는 시간 (원문 접힘 제외, 분당 500자)
  const c=el.cloneNode(true);c.querySelectorAll('details.orig').forEach(x=>x.remove());
  const n=c.textContent.replace(/\s+/g,'').length;$('#rtime').textContent=`읽는 시간 약 ${Math.max(1,Math.ceil(n/500))}분`;
  const o=el.querySelector('details.orig');if(o&&!d.readable)o.open=true}

/* ---------- 물어보기 ---------- */
const EXQ=['순이익 2억 법인, 대표 52세, 잉여금 15억이면 어떤 컨셉부터?','개인사업자 순이익 1.2억, 법인전환 제안하려면 무엇부터 확인?','사근복 제안 전에 꼭 확인할 것?','대표 60세, 자녀 승계 고민인 제조 법인은 첫 미팅에서 무엇을 물어볼까?'];
let HIST=[];
function situation(){const parts=[...document.querySelectorAll('[data-s]')].map(x=>x.value.trim()?`${x.dataset.s}: ${x.value.trim()}`:'').filter(Boolean);return parts.length?'[업체 상황] '+parts.join(', '):''}
function bigrams(s){const out=new Set();(String(s).toLowerCase().match(/[가-힣a-z0-9]+/g)||[]).forEach(w=>{if(/^[a-z0-9]+$/.test(w)){if(w.length>=2)out.add(w);return}for(let i=0;i<w.length-1;i++)out.add(w.slice(i,i+2))});return out}
let IDX=null;
async function buildIndex(){if(IDX)return IDX;
  const cand=M.docs.filter(d=>['concept','ap','faq'].includes(d.gid));
  const rows=await Promise.all(cand.map(async d=>{try{const t=easyPart(await docText(d));return {d,t,ti:bigrams(d.title+' '+(d.concept||'')),hd:bigrams(t.slice(0,2000))}}catch(e){return null}}));
  const list=rows.filter(Boolean),df=new Map();
  list.forEach(r=>new Set([...r.ti,...r.hd]).forEach(b=>df.set(b,(df.get(b)||0)+1)));
  IDX={list,df,N:list.length};return IDX}
async function retrieve(q){const ix=await buildIndex(),Q=bigrams(q);
  const scored=ix.list.map(r=>{let s=0;Q.forEach(b=>{const idf=Math.log((ix.N+1)/((ix.df.get(b)||0)+1));if(idf<=0.2)return;if(r.ti.has(b))s+=3*idf;if(r.hd.has(b))s+=idf});return {r,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const top=scored.slice(0,4);const best=top[0]?top[0].s:0;
  return top.filter(x=>x.s>=best*0.35).map(x=>x.r)}
function snippet(t){const m=t.match(/>\s*\*\*한눈에\*\*\s*([^\n]+)/);const s=(m?m[1]:t.replace(/^#.*$/m,'')).replace(/[#>*|`_]/g,' ').replace(/\s+/g,' ').trim();return s.length>120?s.slice(0,120)+'…':s}
function addBub(cls,html){const b=document.createElement('div');b.className='bub '+cls;b.innerHTML=html;$('#chat').appendChild(b);b.scrollIntoView({behavior:'smooth',block:'nearest'});return b}
function refsHtml(refs,label){return refs.length?`<div class="refs">${label}<div class="chips">${refs.map(r=>`<a class="chip" href="#${r.d.id}">${esc(r.d.title)}</a>`).join('')}</div></div>`:''}
async function showAsk(){tpl('tpl-ask');HIST=[];
  $('#exq').innerHTML=EXQ.map(q=>`<button class="chip" type="button">${esc(q)}</button>`).join('');
  $('#exq').onclick=e=>{const b=e.target.closest('.chip');if(b){$('#askq').value=b.textContent;$('#askq').focus()}};
  const st=$('#askState');
  const ready=await aiReady();
  if(!$('#askState'))return;
  st.innerHTML=ready?'<b>AI 연결됨</b><span>답은 참고용입니다. 질문과 관련된 컨셉 문서를 함께 보여 드립니다.</span>'
    :'<b>AI 상담은 준비 중 (연결하면 켜집니다)</b><span>지금은 질문과 관련 있는 컨셉·화법·상품 문서를 찾아 드립니다. 그것만으로도 시작하기 좋습니다.</span>';
  const q=$('#askq');
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#askf').requestSubmit()}});
  $('#askReset').onclick=()=>{HIST=[];$('#chat').innerHTML=''};
  $('#askf').addEventListener('submit',async e=>{e.preventDefault();const text=q.value.trim();if(!text)return;
    const sit=situation(),full=(sit?sit+'\n':'')+text;
    const pii=piiFound(full);if(pii.length){addBub('a',`<p class="msg err">개인정보로 보이는 내용(${esc(pii.join(', '))})이 있어 보내지 않았습니다. 지우고 다시 물어봐 주세요.</p>`);return}
    q.value='';addBub('u',esc(full));const btn=$('#askBtn');btn.disabled=true;
    const wait=addBub('a wait','관련 문서를 찾는 중…');
    let refs=[];try{refs=await retrieve(full+' '+HIST.filter(m=>m.role==='user').slice(-1).map(m=>m.content).join(' '))}catch(err){}
    if(!(await aiReady())){
      wait.className='bub a';
      wait.innerHTML=refs.length?`<p><b>AI 상담은 준비 중입니다.</b> (연결하면 켜집니다) 대신 질문과 관련 있는 문서를 찾았어요. 맨 위 "한눈에"와 "꼭 확인할 것"부터 보세요.</p><div class="list">${refs.map(r=>`<a class="row" href="#${r.d.id}"><span class="t">${esc(r.d.title)}<div class="ref-snip">${esc(snippet(r.t))}</div></span></a>`).join('')}</div>`
        :'<p><b>AI 상담은 준비 중입니다.</b> 관련 문서를 찾지 못했어요. <a href="#concepts">컨셉 사전</a>에서 둘러보거나 낱말을 바꿔 물어봐 주세요.</p>';
      btn.disabled=false;return}
    wait.textContent='답을 만드는 중입니다… (10~30초)';
    try{const r=await api({action:'ask',question:full,context:refs.map(x=>({title:x.d.title,text:x.t.slice(0,2500)})),history:HIST.slice(-6)});
      wait.className='bub a';
      if(r&&r.ok){wait.innerHTML=md(String(r.answer).replace(/</g,'&lt;'))+refsHtml(refs,'참고한 컨셉');HIST.push({role:'user',content:full},{role:'assistant',content:r.answer})}
      else{if(r&&(r.code==='no_key'))AI=false;wait.innerHTML=`<p class="msg err">${esc((r&&r.error)||'답을 받지 못했습니다.')}</p>`+refsHtml(refs,'대신 이 문서를 보세요')}
    }catch(err){wait.className='bub a';wait.innerHTML='<p class="msg err">연결에 실패했습니다. 잠시 후 다시 시도해 주세요.</p>'+refsHtml(refs,'대신 이 문서를 보세요')}
    btn.disabled=false})}

let ANN_CLOSED=false;
function announce(){const home=['','home'].includes(location.hash.replace('#',''));let el=document.querySelector('.ann');
  if(!home||ANN_CLOSED){if(el)el.remove();return}if(el)return;el=document.createElement('div');el.className='ann';el.setAttribute('role','dialog');
  el.innerHTML=`<b>새로 생겼어요 ✨</b><ul><li><b>바로 고치기</b>: 모든 문서 위 버튼으로 누구나 고치면 바로 반영돼요.</li><li><b>AI에게 가르치기</b>: 자료나 요청을 보내면 매일 밤 AI가 학습해서 사이트를 고쳐요.</li></ul><div class="btnrow"><a class="btn p sm" href="#together">가르치러 가기</a><button class="btn sm" type="button">닫기</button></div>`;
  const close=()=>{ANN_CLOSED=true;el.remove()};el.querySelector('button').onclick=close;el.querySelector('a').addEventListener('click',close);document.body.appendChild(el)}
window.addEventListener('hashchange',()=>{ANN_CLOSED=false;announce()});setTimeout(announce,800);
Promise.all([
  fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),

]).then(([m,c])=>{if(m)M=m;CFG={endpoint:String((c&&c.endpoint)||'').trim()};
  $('#built').textContent=m?`업데이트 ${m.built}`:'목록을 불러오지 못했습니다';show()});
