<div id="g47" style="position:fixed;inset:0;z-index:2147483000;background:#0a0b0d;display:grid;place-items:center;font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif">
  <form id="g47f" style="background:#fff;border:0;border-radius:24px;padding:28px 26px;width:min(340px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.06)">
    <div style="font-weight:800;font-size:20px;color:#0a0b0d">4&amp;7 NEXT</div>
    <div style="color:#5f6b66;font-size:14px;margin:6px 0 16px">팀 비밀번호를 넣어 주세요. 한 번 넣으면 이 기기에서 기억합니다.</div>
    <input id="g47p" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #dee1e6;border-radius:12px;font-size:16px">
    <button type="submit" style="margin-top:12px;width:100%;padding:11px;border:0;border-radius:100px;background:#0052FF;color:#fff;font-size:15px;font-weight:700;cursor:pointer">들어가기</button>
    <div id="g47m" style="color:#E5322D;font-size:13px;margin-top:8px;min-height:1em"></div>
  </form>
</div>
<script>(function(){var K='team_pass',CFG='../config.json',g=document.getElementById('g47'),m=document.getElementById('g47m'),v='';
try{v=localStorage.getItem(K)||''}catch(e){}
function ep(){return fetch(CFG,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){return String(j.endpoint||'').trim()}).catch(function(){return ''})}
var dv='';try{dv=localStorage.getItem('g47dv')||'';if(!dv){dv=Math.random().toString(36).slice(2,10);localStorage.setItem('g47dv',dv)}}catch(e){}
function check(p,k){var pg=(location.pathname.split('/').filter(Boolean).pop()||'hub')+(location.hash||'').slice(0,20);return ep().then(function(e){if(!e)return null;return fetch(e+'?action=passcheck&pass='+encodeURIComponent(p)+'&k='+(k||'auto')+'&pg='+encodeURIComponent(pg)+'&dv='+dv+'&r='+Date.now()).then(function(r){return r.json()}).then(function(j){return !!j.ok}).catch(function(){return null})})}
if(v){g.style.display='none';check(v).then(function(ok){if(ok===false){try{localStorage.removeItem(K)}catch(e){}g.style.display='grid';m.textContent='비밀번호가 바뀌었어요. 다시 넣어 주세요.'}})}
else setTimeout(function(){var i=document.getElementById('g47p');if(i)i.focus()},50);
document.getElementById('g47f').addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('g47p').value.trim();if(!p)return;m.style.color='#5f6b66';m.textContent='확인 중…';
  check(p,'new').then(function(ok){if(ok===false){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않아요.';return}
    if(ok===null){m.style.color='#c0392b';m.textContent='연결하지 못했어요. 잠시 후 다시 시도해 주세요.';return}
    try{localStorage.setItem(K,p)}catch(e){}g.style.display='none';try{location.reload()}catch(e){}})});
})();</script>

<div class="wrap">
  <a class="brand" href="../index.html#home">4&amp;7 NEXT 허브</a>
  <h1>보험 MBTI <span style="font-size:15px;color:var(--sub);font-weight:400">전문직 설계사 성향검사 · 1차안</span></h1>
  <p class="lead">좋은 자료를 줘도 사람마다 결과가 다릅니다. 이 검사는 «나는 어떤 방식으로 영업할 때 잘 되는 사람인지»를 알려 주고, 맞는 업체 규모·연습·코칭을 추천합니다. 8분, 48문항.</p>

  <section class="panel" id="intro">
    <h2>나에 대해</h2>
    <div class="row3">
      <label class="f">이름 또는 호칭 (팀 기록용)<input id="who" placeholder="예: 김세원"></label>
      <label class="f">자격<select id="cert"><option>세무사</option><option>회계사</option><option>노무사</option><option>변리사</option><option>변호사</option><option>기타</option></select></label>
      <label class="f">설계사 경력<select id="career"><option value="0">위촉 전·MBA</option><option value="1">1년 미만</option><option value="2">1~3년</option><option value="3">3년 이상</option></select></label>
    </div>
    <p class="hint">정답이 없습니다. «되고 싶은 나»가 아니라 «지금 실제로 하는 나»에 가깝게 고르세요. 비슷한 질문이 일부러 두 번 나옵니다.</p>
  </section>

  <section class="panel" id="qs"></section>
  <div class="sticky"><div style="flex:1"><div class="bar"><i id="prog" style="width:0"></i></div><span class="hint" id="cnt"></span></div><button class="btn p" id="done">결과 보기</button></div>

  <section id="result" hidden></section>
</div>

    <tr><th>동행</th><td>${P[3] === 'T' ? '동행형입니다. 지점장·다른 자격사와 동행 일정을 주 단위로 먼저 잡으세요.' : '독립형입니다. 자료를 충분히 받아 혼자 가되, 금액이 내 범위를 넘으면 PC만 동행하세요.'}</td></tr></table>
  </section>
  <section class="panel"><h2>대표님 성향별 궁합</h2><p class="hint">업체 분석의 «대표님 성향» 칸과 짝입니다.</p>
    <table><tr><th>대표님</th><th>나와 만나면</th></tr>${Object.entries(MATCH).map(([k, m]) => `<tr><td>${k}</td><td>${esc(P.map(p => m[p]).filter(Boolean)[0] || '무난함. 업체 분석 «대표님 성향» 안내를 따르세요')}</td></tr>`).join('')}</table>
  </section>
  <details class="panel"><summary style="cursor:pointer;font-weight:700">16가지 유형 한눈에 보기</summary>
    <table style="margin-top:8px"><tr><th style="width:62px">유형</th><th style="width:150px">별명</th><th>이런 사람</th></tr>${Object.entries(TYPES).map(([k, t]) => `<tr${k === R.code ? ' style="background:#eef3ff"' : ''}><td><b>${k}</b></td><td>${esc(t[0])}</td><td>${esc(t[1])}</td></tr>`).join('')}</table></details>
  <section class="panel"><h2>다음 할 일</h2><ol>
    <li>«AP 롤플레이»에서 보강할 단계를 보통 난이도로 한 번 연습</li>
    <li>지점장에게 이 결과를 보여 주고 «나에게 맞는 업체 규모»로 다음 AP 대상 고르기</li>
    <li>3개월 뒤 다시 검사해 바뀐 점 보기</li></ol>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn p" id="send">팀 기록에 저장</button><a class="btn" href="roleplay.html">AP 롤플레이로 가기</a><button class="btn" id="again">다시 하기</button></div>
    <p class="hint" id="sendMsg">저장하면 지점장이 팀 결과를 볼 수 있습니다(팀 비밀번호 기기만). 저장하지 않으면 이 브라우저에만 남습니다.</p>
  </section>
  <p class="hint">1차안입니다. 문항과 해석은 김세원 지점장 아이디어를 바탕으로 개발팀이 만든 초안이며, 팀 의견과 실제 실적 데이터(3~6개월)로 계속 고칩니다.</p>`;
  $('result').scrollIntoView({ behavior: 'smooth' });
  $('again').onclick = () => { Object.keys(ans).forEach(k => delete ans[k]); save(); renderQs(); $('result').hidden = true; window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('send').onclick = () => {
    const TP = (() => { try { return localStorage.getItem('team_pass') || ''; } catch (e) { return ''; } })();
    if (!TP) { $('sendMsg').textContent = '팀 비밀번호를 넣은 기기에서만 저장할 수 있어요.'; return; }
    fetch('../config.json', { cache: 'no-store' }).then(r => r.json()).then(c => fetch(c.endpoint, { method: 'POST', body: JSON.stringify({ action: 'mbti', pass: TP, who: $('who').value, cert: $('cert').value, career: $('career').value, code: R.code, nick: (TYPES[R.code] || [nick])[0], pct: R.ax.map(x => x.pct), gap: R.gap, ans: Q.map((q, i) => ans[i]) }) })).then(r => r.json())
      .then(r => { $('sendMsg').textContent = r.ok ? '팀 기록에 저장했어요.' : (r.error || '저장하지 못했어요.'); }).catch(() => { $('sendMsg').textContent = '서버에 연결하지 못했어요.'; });
  };
}
$('done').onclick = result;
['who','cert','career'].forEach(k => $(k).addEventListener('change', save));
load(); renderQs();
})();
</script>
</body>
</html>
